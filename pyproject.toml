[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "awengine"
version = "1.1.0"
description = "Agent Workflow Engine - declarative, verifiable, resumable agent workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "TheBland73" }]
keywords = ["agents", "workflow", "orchestration", "llm", "yaml", "multi-agent", "code-review"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Software Development :: Quality Assurance",
  "Typing :: Typed",
]
dependencies = [
  "pydantic>=2.6,<3",
  "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/TheBland73/AWengine"
Documentation = "https://github.com/TheBland73/AWengine/tree/main/docs"
Repository = "https://github.com/TheBland73/AWengine"
Issues = "https://github.com/TheBland73/AWengine/issues"
Changelog = "https://github.com/TheBland73/AWengine/blob/main/CHANGELOG.md"

[project.optional-dependencies]
llm = ["openai>=1.40,<3"]
shell = ["prompt_toolkit>=3.0"]
dev = ["pytest>=8"]

[project.scripts]
awf = "awengine.cli:main"

[tool.setuptools.packages.find]
include = ["awengine*"]

[tool.setuptools.package-data]
awengine = ["py.typed", "templates/**/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: longer smoke tests"]
filterwarnings = ["ignore::DeprecationWarning"]
