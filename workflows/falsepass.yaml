# False-pass demonstration: visible tests pass, hidden holdout tests fail.
#
# The engine reports F-VERIFY-FALSEPASS instead of trusting the visible suite.
# Run it with `awf run falsepass --fake`; the run is intentionally blocked.
name: falsepass
version: 1
defaults:
  model: deepseek-chat

nodes:
  plan:
    type: builtin
    impl: echo
    config:
      value: "A change that passes the visible suite but breaks the hidden contract."

edges:
  - {src: plan, dst: END}

converge:
  goal: "verify.passed"
  rounds: {min: 1, max: 1}
  steps: {min: 1, max: 2}
  attempts: {min: 0, max: 1}
  on_exhausted: report

verify:
  level: 4
  cmd: "python -m pytest -q"
  holdout: "../fixtures/holdout/test_falsepass_holdout.py"
  timeout_s: 120
