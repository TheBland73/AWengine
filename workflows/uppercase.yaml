# Deterministic workflow (no LLM): shows plugin nodes and the pure control plane.
#   awf run uppercase
name: uppercase
version: 1
nodes:
  start:
    type: python
    impl: nodes.uppercase:run
    config:
      text: "hello workflow"
  done:
    type: builtin
    impl: set
    config:
      values:
        ok: "true"
edges:
  - {src: start, dst: done}
  - {src: done, dst: END}
converge:
  goal: "start.length > 0"
  rounds: {min: 1, max: 1}
  steps: {min: 1, max: 4}
